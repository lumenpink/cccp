name: "CI & Release"

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    name: Run ShellSpec Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install ShellSpec
        run: |
          curl -fsSL https://git.io/shellspec | sh -s -- --yes
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure Git for tests
        run: |
          git config --global init.defaultBranch main
          git config --global user.name "Test User"
          git config --global user.email "test@example.com"

      - name: Run ShellSpec (Modular Mode)
        run: |
          shellspec --format documentation

      - name: Build Standalone Executable
        run: |
          ./combine.sh
          if [ -n "$(git status --porcelain cccp.sh)" ]; then
            echo "::warning ::cccp.sh was not up-to-date with combine.sh. Regeneration succeeded."
          fi

      - name: Run ShellSpec (Bundled Mode)
        run: |
          CCCP_TEST_TARGET=bundled shellspec --format documentation

  release:
    name: Publish Release or Nightly
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build standalone cccp.sh
        run: |
          ./combine.sh

      - name: Publish Official Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          CLEAN_VER="${TAG#v}"
          TAG_SUBJECT=$(git tag -l --format="%(contents:subject)" "$TAG" 2>/dev/null || true)
          RELEASE_TITLE="$TAG"
          if echo "$TAG_SUBJECT" | grep -q ': '; then
            TITLE_PART=$(echo "$TAG_SUBJECT" | sed -E 's/^[^:]+: //')
            RELEASE_TITLE="$TAG - $TITLE_PART"
          fi
          
          # Extract notes from CHANGELOG.md
          NOTES=$(awk -v t1="$TAG" -v t2="$CLEAN_VER" '
            $0 ~ "^### \\[" t1 "\\]" || $0 ~ "^### \\[" t2 "\\]" { in_section = 1; next }
            in_section && ($0 ~ "^###? \\[" || $0 ~ "^## ") { in_section = 0 }
            in_section { print }
          ' CHANGELOG.md)
          
          # Check if notes contain actual bullet points
          if echo "$NOTES" | grep -q '^[[:space:]]*- '; then
            echo "$NOTES" > /tmp/release_notes.md
          else
            echo "- Routine maintenance, documentation updates, and operational improvements." > /tmp/release_notes.md
          fi

          gh release create "$TAG" cccp.sh \
            --title "$RELEASE_TITLE" \
            --notes-file /tmp/release_notes.md

      - name: Publish Nightly Build
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          COMMIT_DATE=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          PRED_VER=$(./cccp.sh version 2>/dev/null && cat VERSION || echo "dev")
          
          # Delete existing nightly release and its tag if it exists
          if gh release view nightly >/dev/null 2>&1; then
            gh release delete nightly --yes --cleanup-tag || true
          fi
          
          cat > /tmp/nightly_notes.md <<EOF
          Automated rolling nightly build from branch \`main\` at commit \`$COMMIT_HASH\` ($COMMIT_DATE).

          **Predicted Next Version:** \`$PRED_VER\`

          ### Standalone Download
          Download directly:
          \`\`\`bash
          curl -fsSL https://github.com/lumenpink/cccp.sh/releases/download/nightly/cccp.sh -o cccp.sh && chmod +x cccp.sh
          \`\`\`
          EOF
          
          gh release create nightly cccp.sh \
            --target main \
            --title "Nightly Build ($COMMIT_HASH)" \
            --notes-file /tmp/nightly_notes.md \
            --prerelease
