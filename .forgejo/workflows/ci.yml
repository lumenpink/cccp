name: "CI & Release"

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1 — Tests & Lint
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: "Tests & Lint"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Install ShellSpec"
        run: |
          curl -fsSL https://git.io/shellspec | sh -s -- --yes
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: "Configure Git for tests"
        run: |
          git config --global init.defaultBranch main
          git config --global user.name "Test User"
          git config --global user.email "test@example.com"

      - name: "Lint & Format Check"
        run: |
          ./combine.sh
          sh -n cccp.sh
          if [ -n "$(git status --porcelain cccp.sh)" ]; then
            echo "::error::cccp.sh is not synchronized with src/. Run ./combine.sh and commit."
            exit 1
          fi

      - name: "Run ShellSpec (Modular Mode)"
        run: |
          shellspec --format documentation -o junit --reportdir report

      - name: "Run ShellSpec (Bundled Mode)"
        run: |
          CCCP_TEST_TARGET=bundled shellspec --format documentation

      - name: "Upload Test Report Artifact"
        if: always()
        uses: https://github.com/actions/upload-artifact@v4
        with:
          name: test-results
          path: report/

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2 — SonarQube / SonarCloud Code Analysis
  # ─────────────────────────────────────────────────────────────────────────────
  sonarqube:
    name: "SonarQube Analysis"
    runs-on: ubuntu-latest
    needs: [test]
    if: github.actor != 'dependabot[bot]'
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: "Verify SONAR_TOKEN"
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::warning::SONAR_TOKEN not configured. Skipping SonarQube analysis."
          fi

      - name: "Checkout repository"
        if: env.SONAR_TOKEN != ''
        uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Download Test Results"
        if: env.SONAR_TOKEN != ''
        continue-on-error: true
        uses: https://github.com/actions/download-artifact@v4
        with:
          name: test-results
          path: report/

      - name: "SonarCloud Scan"
        if: env.SONAR_TOKEN != ''
        uses: https://github.com/SonarSource/sonarqube-scan-action@v5.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY || 'lumenpink_cccp' }}
            -Dsonar.organization=${{ vars.SONAR_ORG || 'lumenpink' }}
            -Dsonar.sources=src,cccp.sh
            -Dsonar.tests=spec
            -Dsonar.testExecutionReportPaths=report/results_junit.xml

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3 — Rolling Nightly Release (Push to main)
  # ─────────────────────────────────────────────────────────────────────────────
  nightly-release:
    name: "Nightly Release"
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: "Checkout repository"
        uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Build standalone cccp.sh"
        run: |
          ./combine.sh
          chmod +x cccp.sh

      - name: "Delete Previous Nightly Tag and Release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_URL: ${{ github.api_url || 'https://codeberg.org/api/v1' }}
          REPO: ${{ github.repository }}
        run: |
          # Delete remote git tag
          git push --delete origin nightly 2>/dev/null \
            && echo "Remote nightly tag deleted" \
            || echo "Remote nightly tag not found (first run?)"

          # Delete existing nightly release via Codeberg API
          REL_ID=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "$API_URL/repos/$REPO/releases/tags/nightly" | grep -o '"id":[0-9]*' | head -n 1 | cut -d: -f2 || true)
          if [ -n "$REL_ID" ]; then
            echo "Deleting nightly release ID: $REL_ID"
            curl -sf -X DELETE -H "Authorization: token $GITHUB_TOKEN" \
              "$API_URL/repos/$REPO/releases/$REL_ID" || echo "Warning: Failed to delete release $REL_ID"
          fi

      - name: "Create Annotated Nightly Tag"
        run: |
          git config user.name "actions-user"
          git config user.email "actions@codeberg.org"
          git tag -d nightly 2>/dev/null || true
          git tag -a nightly -m "Nightly build - $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          git push origin nightly

      - name: "Publish Nightly Release"
        uses: https://github.com/softprops/action-gh-release@v2
        with:
          tag_name: "nightly"
          name: "Nightly Build ($(git rev-parse --short HEAD))"
          prerelease: true
          files: cccp.sh
          body: |
            Automated rolling nightly build from branch `main` at commit `${{ github.sha }}`.

            ### Standalone Download
            ```bash
            curl -fsSL https://codeberg.org/${{ github.repository }}/releases/download/nightly/cccp.sh -o cccp.sh && chmod +x cccp.sh
            ```

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 4 — Official Stable Release (Tags v*)
  # ─────────────────────────────────────────────────────────────────────────────
  release:
    name: "Publish Official Release"
    runs-on: ubuntu-latest
    needs: [test]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: "Checkout repository"
        uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Build standalone cccp.sh"
        run: |
          ./combine.sh
          chmod +x cccp.sh

      - name: "Gosplan SemVer Quality Check"
        run: |
          TAG="${{ github.ref_name }}"
          CLEAN_VER="${TAG#v}"
          if [ ! -f VERSION ]; then
            echo "::error::VERSION file does not exist in release commit!"
            exit 1
          fi
          FILE_VER=$(head -n 1 VERSION | tr -d ' \r\n')
          if [ "$CLEAN_VER" != "$FILE_VER" ]; then
            echo "::error::Tag '$TAG' does not match VERSION file content ('$FILE_VER')!"
            exit 1
          fi
          echo "Gosplan SemVer verification passed: tag '$TAG' matches VERSION '$FILE_VER'."

      - name: "Extract Release Notes"
        id: notes
        run: |
          TAG="${{ github.ref_name }}"
          CLEAN_VER="${TAG#v}"
          TAG_SUBJECT=$(git tag -l --format="%(contents:subject)" "$TAG" 2>/dev/null || true)
          RELEASE_TITLE="$TAG"
          if echo "$TAG_SUBJECT" | grep -q ': '; then
            TITLE_PART=$(echo "$TAG_SUBJECT" | sed -E 's/^[^:]+: //')
            RELEASE_TITLE="$TAG - $TITLE_PART"
          fi
          echo "title=$RELEASE_TITLE" >> "$GITHUB_OUTPUT"

          NOTES=$(awk -v t1="$TAG" -v t2="$CLEAN_VER" '
            $0 ~ "^### \\[" t1 "\\]" || $0 ~ "^### \\[" t2 "\\]" { in_section = 1; next }
            in_section && ($0 ~ "^###? \\[" || $0 ~ "^## ") { in_section = 0 }
            in_section { print }
          ' CHANGELOG.md)

          if echo "$NOTES" | grep -q '^[[:space:]]*- '; then
            echo "$NOTES" > /tmp/release_notes.md
          else
            echo "- Routine maintenance, documentation updates, and operational improvements." > /tmp/release_notes.md
          fi

      - name: "Publish Official Release"
        uses: https://github.com/softprops/action-gh-release@v2
        with:
          tag_name: "${{ github.ref_name }}"
          name: "${{ steps.notes.outputs.title }}"
          files: cccp.sh
          body_path: /tmp/release_notes.md
