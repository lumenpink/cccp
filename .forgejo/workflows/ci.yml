name: "CI/CD & Release to Banca"

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: "Checks, Tests & Quality Gates"
    runs-on: ubuntu-latest
    container:
      image: gambi.2lp.in/lumen/gost-ci-cross:latest
    steps:
      - name: "Checkout repository"
        uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Configure Cargo Registry"
        run: |
          mkdir -p "$HOME/.cargo"
          printf '[registries.gambi]\nindex = "sparse+https://gambi.2lp.in/api/packages/lumen/cargo/"\n[registries.lumen]\nindex = "sparse+https://gambi.2lp.in/api/packages/lumen/cargo/"\n' > "$HOME/.cargo/config.toml"

      - name: "Format Check"
        run: cargo fmt --check

      - name: "Clippy Check (Zero Warnings)"
        env:
          no_proxy: "localhost,127.0.0.1,::1"
          NO_PROXY: "localhost,127.0.0.1,::1"
        run: cargo clippy --all-targets -- -D warnings

      - name: "Run Unit & Integration Tests"
        env:
          RUST_MIN_STACK: "8388608"
          no_proxy: "localhost,127.0.0.1,::1"
          NO_PROXY: "localhost,127.0.0.1,::1"
        run: cargo test --all-targets

      - name: "Verify Standalone Bash Bundle"
        run: |
          ./combine.sh
          test -s cccp.sh
          chmod +x cccp.sh
          ./cccp.sh version || true

      - name: "CCCP Quality Audit"
        run: |
          if command -v cccp >/dev/null 2>&1; then
            cccp check --strict || true
          fi

      - name: "Sccache Telemetry & Stats"
        if: always()
        run: |
          if command -v sccache >/dev/null 2>&1; then
            sccache --show-stats || true
          fi

  deploy-banca:
    name: "Build & Publish CCCP Multiarch to Banca"
    runs-on: ubuntu-latest
    needs: [test]
    if: success() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    container:
      image: gambi.2lp.in/lumen/gost-ci-cross:latest
    steps:
      - name: "Checkout repository"
        uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Determine Release Channel and Version"
        id: meta
        run: |
          REF="${{ github.ref }}"
          if [[ "$REF" == refs/tags/v* ]]; then
            CHANNEL="stable"
            VERSION="${REF#refs/tags/v}"
          else
            CHANNEL="nightly"
            BASE_VER=$(head -n 1 VERSION 2>/dev/null | cut -d'+' -f1 | tr -d ' \r\n' || echo "3.2.0-dev")
            GIT_SHA=$(git rev-parse --short HEAD)
            DATE_STAMP=$(date +%Y%m%d)
            VERSION="${BASE_VER}+${DATE_STAMP}.${GIT_SHA}"
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "★ Canal: $CHANNEL | Versão: $VERSION"

      - name: "Configure Cargo Registry"
        run: |
          mkdir -p "$HOME/.cargo"
          printf '[registries.gambi]\nindex = "sparse+https://gambi.2lp.in/api/packages/lumen/cargo/"\n[registries.lumen]\nindex = "sparse+https://gambi.2lp.in/api/packages/lumen/cargo/"\n' > "$HOME/.cargo/config.toml"

      - name: "Build Standalone Shell Script Bundle"
        run: |
          ./combine.sh
          chmod +x cccp.sh

      - name: "Compile CCCP Multiarch Binaries"
        run: |
          echo "★ [1/3] Compilando x86_64-unknown-linux-musl (Linux AMD64)..."
          RUSTFLAGS="-C target-feature=+crt-static -C link-arg=-static" \
          cargo zigbuild --release --target x86_64-unknown-linux-musl -p cccp || \
          RUSTFLAGS="-C target-feature=+crt-static -C link-arg=-static" \
          cargo build --release --target x86_64-unknown-linux-musl -p cccp

          echo "★ [2/3] Compilando aarch64-unknown-linux-musl (Linux ARM64)..."
          RUSTFLAGS="-C target-feature=+crt-static -C link-arg=-static" \
          cargo zigbuild --release --target aarch64-unknown-linux-musl -p cccp || \
          RUSTFLAGS="-C target-feature=+crt-static -C link-arg=-static" \
          cargo build --release --target aarch64-unknown-linux-musl -p cccp

          echo "★ [3/3] Compilando x86_64-pc-windows-gnu (Windows AMD64)..."
          cargo zigbuild --release --target x86_64-pc-windows-gnu -p cccp || \
            cargo build --release --target x86_64-pc-windows-gnu -p cccp

          echo "★ Validando que binários musl são puramente estáticos sem interpretador dinâmico..."
          readelf -l target/x86_64-unknown-linux-musl/release/cccp | grep -q "program interpreter" && {
            echo "ERRO CRÍTICO: target/x86_64-unknown-linux-musl/release/cccp contém interpretador dinâmico!"
            exit 1
          } || echo "✓ target/x86_64-unknown-linux-musl/release/cccp é 100% estático."

          echo "★ Executando teste de fumaça no executável compilado..."
          ./target/x86_64-unknown-linux-musl/release/cccp --version

      - name: "Package Artifacts & Generate Checksums"
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          mkdir -p dist/packages

          # 1. Empacotar Linux AMD64
          if [ -f target/x86_64-unknown-linux-musl/release/cccp ]; then
            tar -czf "dist/packages/cccp-${VERSION}-linux-amd64.tar.gz" \
              -C target/x86_64-unknown-linux-musl/release cccp \
              -C "$PWD" cccp.sh install.sh README.md LICENSE 2>/dev/null || \
            tar -czf "dist/packages/cccp-${VERSION}-linux-amd64.tar.gz" \
              -C target/x86_64-unknown-linux-musl/release cccp
          fi

          # 2. Empacotar Linux ARM64
          if [ -d target/aarch64-unknown-linux-musl/release ]; then
            tar -czf "dist/packages/cccp-${VERSION}-linux-arm64.tar.gz" \
              -C target/aarch64-unknown-linux-musl/release cccp \
              -C "$PWD" cccp.sh install.sh README.md LICENSE 2>/dev/null || \
            tar -czf "dist/packages/cccp-${VERSION}-linux-arm64.tar.gz" \
              -C target/aarch64-unknown-linux-musl/release cccp
          fi

          # 3. Empacotar Windows AMD64
          if [ -d target/x86_64-pc-windows-gnu/release ]; then
            cd target/x86_64-pc-windows-gnu/release
            zip -j "$GITHUB_WORKSPACE/dist/packages/cccp-${VERSION}-windows-amd64.zip" \
              cccp.exe "$GITHUB_WORKSPACE/cccp.sh" "$GITHUB_WORKSPACE/install.sh" "$GITHUB_WORKSPACE/README.md" "$GITHUB_WORKSPACE/LICENSE" 2>/dev/null || \
            zip -j "$GITHUB_WORKSPACE/dist/packages/cccp-${VERSION}-windows-amd64.zip" \
              cccp.exe
            cd "$GITHUB_WORKSPACE"
          fi

          # 4. Incluir standalone cccp.sh e install.sh no diretório de pacotes
          cp cccp.sh "dist/packages/cccp.sh"
          cp install.sh "dist/packages/install.sh"

          cd dist/packages
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          cd "$GITHUB_WORKSPACE"

      - name: "Publish Artifacts & Site Bundle to Forgejo Generic Packages"
        env:
          TOKEN: ${{ secrets.REGISTRY_TOKEN || secrets.GAMBI_2LP_IN_TOKEN || secrets.FORGEJO_TOKEN || secrets.GIT_2LP_TOKEN }}
        run: |
          CHANNEL="${{ steps.meta.outputs.channel }}"
          VERSION="${{ steps.meta.outputs.version }}"

          if [ -z "$TOKEN" ]; then
            echo "Aviso: Token da forja ausente. Pulando publicação em Generic Packages."
            exit 0
          fi

          echo "★ Publicando pacotes de staging no Generic Package Registry (cccp/${VERSION})..."
          for PKG in dist/packages/*; do
            [ -f "$PKG" ] || continue
            PKG_NAME=$(basename "$PKG")
            curl -s -f --retry 3 -X PUT \
              -H "Authorization: token $TOKEN" \
              -T "$PKG" \
              "https://gambi.2lp.in/api/packages/lumen/generic/cccp/${VERSION}/${PKG_NAME}"
          done

          if [ -d site ]; then
            echo "★ Empacotando e publicando site estático (site.tar.gz) para o Kombinat..."
            tar -czf dist/site.tar.gz -C site .
            curl -s -f --retry 3 -X PUT \
              -H "Authorization: token $TOKEN" \
              -T dist/site.tar.gz \
              "https://gambi.2lp.in/api/packages/lumen/generic/cccp/${VERSION}/site.tar.gz"
          fi

          if [ "$CHANNEL" = "nightly" ] && [ -f target/x86_64-unknown-linux-musl/release/cccp ]; then
            echo "★ Atualizando alias nightly linux-amd64 no Forgejo Generic Packages (consumido pelo gost-ci)..."
            curl -s -X DELETE \
              -H "Authorization: token $TOKEN" \
              "https://gambi.2lp.in/api/packages/lumen/generic/cccp/nightly/cccp-linux-amd64" >/dev/null 2>&1 || true

            curl -s -f --retry 3 -X PUT \
              -H "Authorization: token $TOKEN" \
              -T target/x86_64-unknown-linux-musl/release/cccp \
              "https://gambi.2lp.in/api/packages/lumen/generic/cccp/nightly/cccp-linux-amd64"
          fi

      - name: "Sccache Telemetry & Stats"
        if: always()
        run: |
          if command -v sccache >/dev/null 2>&1; then
            sccache --show-stats || true
          fi
