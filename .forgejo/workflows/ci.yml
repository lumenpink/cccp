name: "CI/CD & Sovereign Release to Banca"

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: "Checks, Tests & Quality Gates"
    runs-on: ubuntu-latest
    container:
      image: gambi.2lp.in/lumen/gost-ci-cross:latest
    steps:
      - name: "Checkout repository"
        uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Configure Sovereign Lumen Cargo Registry"
        run: |
          mkdir -p "$HOME/.cargo"
          printf '[registries.lumen]\nindex = "sparse+https://gambi.2lp.in/api/packages/lumen/cargo/"\n' > "$HOME/.cargo/config.toml"

      - name: "Format Check"
        run: cargo fmt -- --check

      - name: "Clippy Check (Zero Warnings)"
        run: cargo clippy --all-targets -- -D warnings

      - name: "Run Unit & Integration Tests"
        env:
          RUST_MIN_STACK: "8388608"
        run: cargo test --all-targets

      - name: "Verify Standalone Bash Bundle"
        run: |
          ./combine.sh
          test -s cccp.sh
          chmod +x cccp.sh
          ./cccp.sh version || true

      - name: "CCCP Quality Audit"
        run: |
          if command -v cccp >/dev/null 2>&1; then
            cccp check --strict || true
          fi

  deploy-banca:
    name: "Build & Publish CCCP Multiarch to Banca"
    runs-on: ubuntu-latest
    needs: [test]
    if: success() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    container:
      image: gambi.2lp.in/lumen/gost-ci-cross:latest
    steps:
      - name: "Checkout repository"
        uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Determine Release Channel and Version"
        id: meta
        run: |
          REF="${{ github.ref }}"
          if [[ "$REF" == refs/tags/v* ]]; then
            CHANNEL="stable"
            VERSION="${REF#refs/tags/v}"
          else
            CHANNEL="nightly"
            BASE_VER=$(head -n 1 VERSION 2>/dev/null | cut -d'+' -f1 | tr -d ' \r\n' || echo "3.2.0-dev")
            GIT_SHA=$(git rev-parse --short HEAD)
            DATE_STAMP=$(date +%Y%m%d)
            VERSION="${BASE_VER}+${DATE_STAMP}.${GIT_SHA}"
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "★ Canal: $CHANNEL | Versão: $VERSION"

      - name: "Configure Sovereign Lumen Cargo Registry"
        run: |
          mkdir -p "$HOME/.cargo"
          printf '[registries.lumen]\nindex = "sparse+https://gambi.2lp.in/api/packages/lumen/cargo/"\n' > "$HOME/.cargo/config.toml"

      - name: "Build Standalone Shell Script Bundle"
        run: |
          ./combine.sh
          chmod +x cccp.sh

      - name: "Compile CCCP Multiarch Binaries"
        run: |
          echo "★ [1/3] Compilando x86_64-unknown-linux-musl (Linux AMD64)..."
          cargo zigbuild --release --target x86_64-unknown-linux-musl -p cccp || \
            cargo build --release --target x86_64-unknown-linux-musl -p cccp

          echo "★ [2/3] Compilando aarch64-unknown-linux-musl (Linux ARM64)..."
          cargo zigbuild --release --target aarch64-unknown-linux-musl -p cccp || \
            cargo build --release --target aarch64-unknown-linux-musl -p cccp

          echo "★ [3/3] Compilando x86_64-pc-windows-gnu (Windows AMD64)..."
          cargo zigbuild --release --target x86_64-pc-windows-gnu -p cccp || \
            cargo build --release --target x86_64-pc-windows-gnu -p cccp

      - name: "Package Artifacts & Generate Checksums"
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          mkdir -p dist/packages

          # 1. Empacotar Linux AMD64
          if [ -d target/x86_64-unknown-linux-musl/release ]; then
            tar -czf "dist/packages/cccp-${VERSION}-linux-amd64.tar.gz" \
              -C target/x86_64-unknown-linux-musl/release cccp \
              -C "$PWD" cccp.sh install.sh README.md LICENSE 2>/dev/null || \
            tar -czf "dist/packages/cccp-${VERSION}-linux-amd64.tar.gz" \
              -C target/x86_64-unknown-linux-musl/release cccp
          fi

          # 2. Empacotar Linux ARM64
          if [ -d target/aarch64-unknown-linux-musl/release ]; then
            tar -czf "dist/packages/cccp-${VERSION}-linux-arm64.tar.gz" \
              -C target/aarch64-unknown-linux-musl/release cccp \
              -C "$PWD" cccp.sh install.sh README.md LICENSE 2>/dev/null || \
            tar -czf "dist/packages/cccp-${VERSION}-linux-arm64.tar.gz" \
              -C target/aarch64-unknown-linux-musl/release cccp
          fi

          # 3. Empacotar Windows AMD64
          if [ -d target/x86_64-pc-windows-gnu/release ]; then
            cd target/x86_64-pc-windows-gnu/release
            zip -j "$GITHUB_WORKSPACE/dist/packages/cccp-${VERSION}-windows-amd64.zip" \
              cccp.exe "$GITHUB_WORKSPACE/cccp.sh" "$GITHUB_WORKSPACE/install.sh" "$GITHUB_WORKSPACE/README.md" "$GITHUB_WORKSPACE/LICENSE" 2>/dev/null || \
            zip -j "$GITHUB_WORKSPACE/dist/packages/cccp-${VERSION}-windows-amd64.zip" \
              cccp.exe
            cd "$GITHUB_WORKSPACE"
          fi

          # 4. Incluir standalone cccp.sh e install.sh no diretório de pacotes
          cp cccp.sh "dist/packages/cccp.sh"
          cp install.sh "dist/packages/install.sh"

          cd dist/packages
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          cd "$GITHUB_WORKSPACE"

      - name: "Upload Artifacts to Cloudflare R2"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          CHANNEL="${{ steps.meta.outputs.channel }}"
          VERSION="${{ steps.meta.outputs.version }}"

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "Aviso: CLOUDFLARE_API_TOKEN ausente. Pulando upload R2."
            exit 0
          fi

          echo "★ Enviando pacotes para o Cloudflare R2 (twolp-bucket / bucket.2lp.in)..."
          for PKG in dist/packages/*; do
            [ -f "$PKG" ] || continue
            PKG_NAME=$(basename "$PKG")
            npx wrangler r2 object put "twolp-bucket/downloads/cccp/${CHANNEL}/${PKG_NAME}" \
              --file="$PKG" --remote || true
          done

      - name: "Publish Nightly Linux AMD64 Binary to Forgejo Generic Packages"
        env:
          TOKEN: ${{ secrets.REGISTRY_TOKEN || secrets.GAMBI_2LP_IN_TOKEN || secrets.FORGEJO_TOKEN || secrets.GIT_2LP_TOKEN }}
        run: |
          CHANNEL="${{ steps.meta.outputs.channel }}"
          if [ "$CHANNEL" = "nightly" ] && [ -n "$TOKEN" ] && [ -f target/x86_64-unknown-linux-musl/release/cccp ]; then
            echo "★ Publicando binário nightly linux-amd64 direto no Forgejo Generic Packages..."
            curl -s -f --retry 3 -X PUT \
              -H "Authorization: token $TOKEN" \
              -T target/x86_64-unknown-linux-musl/release/cccp \
              "https://gambi.2lp.in/api/packages/lumen/generic/cccp/nightly/cccp-linux-amd64" || echo "Aviso: Falha ao publicar pacote genérico no Forgejo."
          fi

      - name: "Rotate Manifest & Commit to Banca"
        env:
          GIT_2LP_TOKEN: ${{ secrets.GIT_2LP_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          CHANNEL="${{ steps.meta.outputs.channel }}"
          VERSION="${{ steps.meta.outputs.version }}"

          echo "★ Clonando repositório soberano da Banca para rotação e retenção..."
          git clone --depth 1 "https://lumen:${GIT_2LP_TOKEN}@gambi.2lp.in/lumen/banca.git" /tmp/banca

          if [ -d "/tmp/banca/site/downloads/cccp" ] && [ -f "/tmp/banca/scripts/rotate-downloads.py" ]; then
            cd /tmp/banca

            # Registrar cada uma das arquiteturas
            for ARCH in "linux-amd64" "linux-arm64" "windows-amd64"; do
              EXT="tar.gz"
              [ "$ARCH" = "windows-amd64" ] && EXT="zip"
              PKG_FILE="cccp-${VERSION}-${ARCH}.${EXT}"

              HASH=$(grep "$PKG_FILE" "$GITHUB_WORKSPACE/dist/packages/SHA256SUMS" | awk '{print $1}' || echo "")
              DOWNLOAD_URL="https://bucket.2lp.in/downloads/cccp/${CHANNEL}/${PKG_FILE}"

              python3 scripts/rotate-downloads.py \
                --manifest site/downloads/cccp/index.json \
                --channel "${CHANNEL}" \
                --arch "${ARCH}" \
                --version-str "${VERSION}" \
                --url "${DOWNLOAD_URL}" \
                --sha256 "${HASH}" \
                --tarball "${PKG_FILE}" \
                --app "cccp"
            done

            # Commitar manifesto atualizado na Banca
            git config user.name "CCCP Release Bot"
            git config user.email "bot@2lp.in"
            git add site/downloads/cccp/index.json
            if ! git diff --staged --quiet; then
              git commit -m "chore(downloads): rotate cccp release to ${VERSION} (#55)"
              git push origin main || echo "Aviso: Push do manifesto na Banca falhou."
            else
              echo "Manifesto já estava atualizado."
            fi
            cd "$GITHUB_WORKSPACE"
          fi

      - name: "Deploy Documentation Site to Cloudflare Pages"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -d site ]; then
            echo "★ Publicando site oficial de documentação (cccp.2lp.in)..."
            npx wrangler pages deploy site --project-name=cccp || true
          fi
