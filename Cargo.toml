[package]
name = "cccp"
version = "3.1.0"
edition = "2021"
authors = ["Lumen Pink <hi@lumen.pink>"]
description = "Conventional Commits Compliance Program (CCCP) - Native Standalone Binary"
license = "GPL-3.0-or-later"
homepage = "https://cccp.2lp.in"
repository = "https://git.2lp.in/lumen/cccp"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo", "env"] }
clap_complete = "4.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
git2 = { version = "0.20", features = ["vendored-openssl"] }
semver = "1.0"
inquire = "0.9"
tempfile = "3.17"
crossterm = "0.29"
flate2 = "1.0"
ureq = { version = "3.4", features = ["json"] }

[dev-dependencies]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
