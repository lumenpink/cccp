<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Radial and Linear Gradients for Soviet Enamel & Gold Finish -->
    <radialGradient id="redEnamel" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#d62828"/>
      <stop offset="70%" stop-color="#b81d1d"/>
      <stop offset="100%" stop-color="#7a0f0f"/>
    </radialGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="40%" stop-color="#e0a526"/>
      <stop offset="70%" stop-color="#b37c12"/>
      <stop offset="100%" stop-color="#7c5306"/>
    </linearGradient>
    <linearGradient id="metalRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdf3cf"/>
      <stop offset="100%" stop-color="#a67111"/>
    </linearGradient>
    <filter id="badgeShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#14110f" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#badgeShadow)">
    <!-- Outer Octagonal / Shield Medal Base -->
    <polygon points="120,8 198,42 228,120 198,198 120,232 42,198 12,120 42,42"
             fill="url(#goldGradient)" stroke="#533804" stroke-width="2.5"/>

    <!-- Inner Stepped Metal Rim -->
    <polygon points="120,16 190,47 218,120 190,193 120,224 50,193 22,120 50,47"
             fill="url(#redEnamel)" stroke="url(#metalRim)" stroke-width="2"/>

    <!-- Constructivist Sunburst / Git Tree Rays -->
    <g stroke="url(#goldGradient)" stroke-width="1.8" opacity="0.45" stroke-linecap="round">
      <line x1="120" y1="120" x2="120" y2="24"/>
      <line x1="120" y1="120" x2="168" y2="40"/>
      <line x1="120" y1="120" x2="204" y2="80"/>
      <line x1="120" y1="120" x2="216" y2="120"/>
      <line x1="120" y1="120" x2="198" y2="164"/>
      <line x1="120" y1="120" x2="160" y2="204"/>
      <line x1="120" y1="120" x2="80" y2="204"/>
      <line x1="120" y1="120" x2="42" y2="164"/>
      <line x1="120" y1="120" x2="24" y2="120"/>
      <line x1="120" y1="120" x2="36" y2="80"/>
      <line x1="120" y1="120" x2="72" y2="40"/>
    </g>

    <!-- Git Branching Nodes & Orbital Arcs -->
    <path d="M 60,140 A 65,65 0 0,1 180,100" fill="none" stroke="url(#goldGradient)" stroke-width="2.2" stroke-dasharray="3,3"/>
    <path d="M 50,110 A 75,75 0 0,0 190,135" fill="none" stroke="url(#goldGradient)" stroke-width="2.2"/>
    
    <!-- Git Nodes (Commit Points) -->
    <circle cx="60" cy="140" r="4.5" fill="#fdf3cf" stroke="#94630e" stroke-width="1.5"/>
    <circle cx="95" cy="105" r="4" fill="#fdf3cf" stroke="#94630e" stroke-width="1.5"/>
    <circle cx="145" cy="98" r="4" fill="#fdf3cf" stroke="#94630e" stroke-width="1.5"/>
    <circle cx="180" cy="100" r="4.5" fill="#fdf3cf" stroke="#94630e" stroke-width="1.5"/>
    <circle cx="120" cy="120" r="5" fill="#ffe082" stroke="#533804" stroke-width="2"/>

    <!-- Prominent Top Red Star with Gold Rim -->
    <polygon points="120,28 126,44 143,44 129,54 135,70 120,60 105,70 111,54 97,44 114,44"
             fill="#c91a1a" stroke="url(#goldGradient)" stroke-width="1.5"/>

    <!-- Central Constructivist Typography "CCCP" -->
    <!-- Stylized Heavy Block Cyrillic Lettering -->
    <g fill="#fdf6e2" stroke="#4a0808" stroke-width="1">
      <!-- C -->
      <path d="M 45,95 H 70 V 105 H 55 V 135 H 70 V 145 H 45 Z" fill="#fdf6e2"/>
      <!-- C -->
      <path d="M 78,95 H 103 V 105 H 88 V 135 H 103 V 145 H 78 Z" fill="#fdf6e2"/>
      <!-- C -->
      <path d="M 111,95 H 136 V 105 H 121 V 135 H 136 V 145 H 111 Z" fill="#fdf6e2"/>
      <!-- P -->
      <path d="M 144,95 H 172 V 125 H 154 V 145 H 144 Z M 154,103 V 117 H 162 V 103 Z" fill="#fdf6e2"/>
    </g>

    <!-- Lower Agitprop Banner Ribbon -->
    <path d="M 32,175 L 120,165 L 208,175 L 196,198 L 120,188 L 44,198 Z"
          fill="#1b1918" stroke="url(#goldGradient)" stroke-width="1.5"/>
    <text x="120" y="184" text-anchor="middle"
          font-family="'Trebuchet MS', 'Impact', sans-serif"
          font-size="8.5" font-weight="900" letter-spacing="1.2"
          fill="#ffe082">CONVENTIONAL COMMITS</text>

    <!-- Subtitle Arch -->
    <text x="120" y="212" text-anchor="middle"
          font-family="'Trebuchet MS', 'Arial Black', sans-serif"
          font-size="7" font-weight="bold" letter-spacing="0.8"
          fill="#fdf6e2">COMPLIANCE PROGRAM</text>
  </g>
</svg>
