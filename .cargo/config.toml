[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static", "-C", "link-arg=-static"]

[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static", "-C", "link-arg=-static"]

[env]
OPENSSL_STATIC = "1"
LIBZ_SYS_STATIC = "1"
PKG_CONFIG_ALL_STATIC = "1"
